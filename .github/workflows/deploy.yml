
name: Build and Deploy Node.js Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Test Node.js Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-deploy:
    name: Build Image and Deploy to EC2
    needs: test
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsDeployment

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build --pull -t "$IMAGE" .
          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy through AWS Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          # Build a safely JSON-encoded SSM command.
          jq -n \
            --arg image "$IMAGE" \
            --arg region "$AWS_REGION" \
            --arg account "$AWS_ACCOUNT_ID" \
            '{
              commands: [
                "set -eu",
                ("aws ecr get-login-password --region " + ($region | @sh) +
                 " | docker login --username AWS --password-stdin " +
                 (($account + ".dkr.ecr." + $region + ".amazonaws.com") | @sh)),
                ("docker pull " + ($image | @sh)),
                "docker stop containerized-web-app 2>/dev/null || true",
                "docker rm containerized-web-app 2>/dev/null || true",
                ("docker run -d --name containerized-web-app --restart unless-stopped -p 8000:8000 " + ($image | @sh)),
                "for i in $(seq 1 20); do if curl -fsS http://127.0.0.8000/health; then exit 0; fi; sleep 3; done",
                "docker logs --tail 100 containerized-web-app || true",
                "exit 1"
              ]
            }' > ssm-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Node.js application from GitHub Actions" \
            --parameters file://ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # Wait for the remote command to finish.
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '[Status,StandardErrorContent,StandardOutputContent]' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for the SSM deployment command."
          exit 1
